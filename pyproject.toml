[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-studio"
version = "0.1.0"
description = "Interactive gridding studio for geochemical and geophysical data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["geochemistry", "geophysics", "gridding", "kriging", "idw", "interpolation", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "geopandas>=0.12",
    "matplotlib>=3.6",
    "rasterio>=1.3",
    "scikit-learn>=1.1",
    "pykrige>=0.7",
    "netCDF4>=1.6",
    "openpyxl>=3.0",
    "pyproj>=3.4",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.4"]
gui-pyside = ["PySide6>=6.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
grid-studio = "grid_studio.__main__:main"

[project.urls]
Homepage = "https://github.com/MarcusSkelton/GRID_STUDIO"
Issues   = "https://github.com/MarcusSkelton/GRID_STUDIO/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["grid_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
